[package]
name = "infoclimat-om-worker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Aggregation service for Open-Meteo OMfiles (cumulative precipitation, etc.)"

[[bin]]
name = "infoclimat-om-worker"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# OMfile read/write — git dep until 0.1 is published on crates.io
omfiles = { git = "https://github.com/open-meteo/rust-omfiles", branch = "main" }
ndarray = "0.17"

# HTTP client for fetching source OMfiles
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
bytes = "1"

# S3 / MinIO cache
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"

# Serialization, time, errors, logs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
